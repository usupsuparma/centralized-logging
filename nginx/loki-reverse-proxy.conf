# ==============================================================================
# Nginx Reverse Proxy Configuration for Grafana Loki & Grafana Dashboard
# Letakkan di /etc/nginx/sites-available/monitoring.conf di Server Monitoring
# ==============================================================================

# 1. Konfigurasi Endpoint Grafana Web UI (Port 3000)
server {
    listen 80;
    server_name grafana.goldchick.co.id;

    # Redirect ke HTTPS jika SSL sudah aktif
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support untuk live log streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 2. Konfigurasi Endpoint Loki Ingestion API (Port 3100)
# Digunakan oleh Grafana Alloy Agent dari Server Aplikasi
server {
    listen 80;
    server_name loki.goldchick.co.id;

    # Batas ukuran payload push log
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Opsional: Basic Auth untuk mengamankan push endpoint jika diakses publik
        # auth_basic "Restricted Loki Push API";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        # Opsional: Whitelist IP Server Aplikasi saja
        # allow 103.xxx.xxx.xxx; # IP Server Aplikasi
        # deny all;
    }
}
